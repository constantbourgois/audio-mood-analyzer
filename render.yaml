services:
  - type: web
    name: audio-mood-analyzer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Workers, timeout and bind all live in gunicorn.conf.py: any flag here
    # would silently override it (see the README's Deployment section).
    startCommand: gunicorn -c gunicorn.conf.py app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
