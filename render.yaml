services:
  - type: web
    name: audio-mood-analyzer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k gthread --threads 4 --timeout 120 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: NUMBA_CACHE_DIR
        value: /tmp
      - key: PYTHON_VERSION
        value: 3.11.9
