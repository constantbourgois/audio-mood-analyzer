<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Audio Analyser{% endblock %}</title>
  <style>
    :root {
      color-scheme: dark;

      --bg: #121110;
      --surface: #1a1918;
      --surface-2: #232120;
      --border: #302c29;
      --border-strong: #433c37;
      --text: #f2ece5;
      --muted: #a49a90;
      --accent: #e8904f;

      /* Palette des pistes : validée sur le fond sombre (bande de clarté
         OKLCH, plancher de chroma, séparation daltonisme, contraste). */
      --c-percussions: #e2604e;
      --c-basses: #35a888;
      --c-accords: #4b8fd6;
      --c-voix: #b8842c;
      --c-chord-major: #4b8fd6;
      --c-chord-minor: #b8842c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem 4rem;
    }

    main { width: 100%; max-width: 680px; }

    h1 {
      font-size: 1.6rem;
      line-height: 1.25;
      letter-spacing: -0.01em;
      margin: 0 0 0.3rem;
      overflow-wrap: anywhere;
    }

    h2 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      font-weight: 700;
      margin: 0 0 0.9rem;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 2rem;
      font-size: 0.93rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .flash {
      background: rgba(226, 96, 78, 0.14);
      border: 1px solid rgba(226, 96, 78, 0.45);
      color: #f7b3a8;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.88rem; }

    input[type="file"] {
      display: block;
      width: 100%;
      padding: 0.9rem;
      border: 1px dashed var(--border-strong);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      margin-bottom: 1.1rem;
      font-size: 0.88rem;
    }
    input[type="file"]:hover { border-color: var(--accent); }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      margin-bottom: 1.4rem;
      font-size: 0.88rem;
    }
    .checkbox-row label { margin: 0; font-weight: 400; color: var(--muted); }
    input[type="checkbox"] { accent-color: var(--accent); margin-top: 0.15rem; }

    button {
      background: var(--accent);
      color: #1b1206;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.55; cursor: default; filter: none; }

    /* --- Upload / analysis progress --- */
    .progress { margin-top: 1.2rem; }
    .progress-track {
      height: 6px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.2s ease-out;
    }
    /* Upload finished, analysis running: the server cannot report progress,
       so the bar sweeps instead of claiming a percentage it does not know. */
    .progress.is-working .progress-fill {
      width: 100% !important;
      transition: none;
      background: linear-gradient(90deg,
        var(--surface-2) 0%, var(--accent) 50%, var(--surface-2) 100%);
      background-size: 200% 100%;
      animation: progress-sweep 1.1s linear infinite;
    }
    @keyframes progress-sweep {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 0.5rem 0 0;
      font-size: 0.82rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    @media (prefers-reduced-motion: reduce) {
      .progress.is-working .progress-fill { animation: none; background: var(--accent); }
      .progress-fill { transition: none; }
    }

    /* --- Ambiance : le résultat principal, traité en conséquence --- */
    .mood-banner {
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-left: 3px solid var(--accent);
      color: var(--text);
      border-radius: 10px;
      padding: 1.1rem 1.2rem;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 1.2rem;
    }

    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin: 0; }
    .metric { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; }
    .metric .label {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .metric .value { font-size: 1.25rem; font-weight: 700; margin-top: 0.2rem; letter-spacing: -0.01em; }

    /* --- Modes --- */
    ul.modes { list-style: none; padding: 0; margin: 0.2rem 0 0; }
    ul.modes li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
      color: var(--muted);
    }
    ul.modes li:last-child { border-bottom: none; }
    ul.modes li.best { font-weight: 700; color: var(--text); font-size: 1rem; }

    /* --- Listes (accords, morceaux similaires) --- */
    ul.similar { list-style: none; padding: 0; margin: 0; max-height: 320px; overflow-y: auto; }
    ul.similar li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.89rem;
    }
    ul.similar li:last-child { border-bottom: none; }

    .chord-chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.7rem; }
    .chord-chip {
      border: 1px solid var(--c-chord-major);
      background: rgba(75, 143, 214, 0.16);
      color: var(--text);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .chord-chip.minor {
      border-color: var(--c-chord-minor);
      background: rgba(184, 132, 44, 0.16);
    }

    .muted { color: var(--muted); font-size: 0.86rem; }
    a.back { color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    a.back:hover { text-decoration: underline; }

    .note {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 1.5rem;
      line-height: 1.6;
    }
    .note code { background: var(--surface-2); padding: 0.1rem 0.3rem; border-radius: 4px; }

    /* --- Structure --- */
    .section-row { margin: 0.9rem 0 1.1rem; }
    .section-svg { width: 100%; height: auto; display: block; }
    .section-block { fill-opacity: 0.34; stroke-width: 1.5; }
    .section-block-0 { fill: var(--c-percussions); stroke: var(--c-percussions); }
    .section-block-1 { fill: var(--c-basses); stroke: var(--c-basses); }
    .section-block-2 { fill: var(--c-accords); stroke: var(--c-accords); }
    .section-block-3 { fill: var(--c-voix); stroke: var(--c-voix); }
    .section-label { fill: var(--text); font-size: 17px; font-weight: 700; }

    ol.timeline { list-style: none; padding: 0; margin: 0; counter-reset: none; }
    ol.timeline li {
      display: flex;
      align-items: baseline;
      gap: 0.8rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }
    ol.timeline li:last-child { border-bottom: none; }
    .timeline-index {
      flex: 0 0 1.6rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .timeline-body { flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.45rem; }
    .timeline-role { font-weight: 700; font-size: 0.95rem; }
    .timeline-family {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0.05rem 0.35rem;
    }
    .timeline-parts { color: var(--muted); font-size: 0.83rem; width: 100%; }
    .timeline-when { flex: 0 0 auto; font-variant-numeric: tabular-nums; text-align: right; }

    @media (max-width: 480px) {
      ol.timeline li { flex-wrap: wrap; }
      .timeline-when { flex: 1 1 100%; text-align: left; padding-left: 2.4rem; }
    }

    /* --- Carte de la chanson --- */
    .song-map { margin: 0.9rem 0 0.5rem; }
    .grid-row { margin-bottom: 0.35rem; }
    .grid-svg, .track-svg, .chord-svg { width: 100%; height: auto; display: block; }
    .measure-line { stroke: var(--border-strong); stroke-width: 1; }
    .measure-label { fill: var(--muted); font-size: 15px; }

    .track-row { margin-bottom: 0.85rem; }
    .track-label {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.45rem;
      font-size: 0.83rem;
      margin-bottom: 0.35rem;
    }
    .track-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; align-self: center; }
    .track-dot-percussions { background: var(--c-percussions); }
    .track-dot-basses { background: var(--c-basses); }
    .track-dot-accords { background: var(--c-accords); }
    .track-dot-voix { background: var(--c-voix); }
    .track-entry { color: var(--muted); font-size: 0.78rem; }
    .track-plot {
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    /* Aires des pistes : la couleur est portée par la classe, pas par le SVG. */
    .track-area { fill-opacity: 0.32; stroke-width: 1.5; }
    .track-area-percussions { fill: var(--c-percussions); stroke: var(--c-percussions); }
    .track-area-basses { fill: var(--c-basses); stroke: var(--c-basses); }
    .track-area-accords { fill: var(--c-accords); stroke: var(--c-accords); }
    .track-area-voix { fill: var(--c-voix); stroke: var(--c-voix); }

    .track-entry-line { stroke-width: 2; stroke-dasharray: 4 2; }
    .track-entry-line-percussions { stroke: var(--c-percussions); }
    .track-entry-line-basses { stroke: var(--c-basses); }
    .track-entry-line-accords { stroke: var(--c-accords); }
    .track-entry-line-voix { stroke: var(--c-voix); }

    .chord-block { fill-opacity: 0.30; stroke-width: 1; }
    .chord-block-major { fill: var(--c-chord-major); stroke: var(--c-chord-major); }
    .chord-block-minor { fill: var(--c-chord-minor); stroke: var(--c-chord-minor); }
    .chord-label { fill: var(--text); font-size: 16px; font-weight: 600; }

    /* --- Player --- */
    .player {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.9rem 1.1rem;
    }
    .player[hidden] { display: none; }
    .player-toggle {
      flex: 0 0 auto;
      width: 2.6rem;
      height: 2.6rem;
      padding: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .player-toggle svg { width: 1rem; height: 1rem; fill: currentColor; }
    .player-toggle .icon-pause { display: none; }
    .player.is-playing .player-toggle .icon-play { display: none; }
    .player.is-playing .player-toggle .icon-pause { display: block; }
    .player-scrub { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
    .player-time {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    .layer-plot { position: relative; }
    .is-live .layer-plot { cursor: pointer; }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 2px;
      margin-left: -1px;
      background: var(--text);
      border-radius: 1px;
      pointer-events: none;
    }

    /* Interval times read as plain text until a player is attached. */
    button.seek {
      background: none;
      border: none;
      border-radius: 4px;
      padding: 0 0.15rem;
      margin: 0 -0.15rem;
      color: inherit;
      font: inherit;
      font-weight: 400;
    }
    button.seek:disabled { opacity: 1; cursor: default; }
    button.seek:not(:disabled) { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 2px; }
    button.seek:not(:disabled):hover { filter: none; text-decoration-style: solid; }

    /* --- Layer timeline --- */
    .layer-row { margin-bottom: 1rem; }
    .layer-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.4rem 0.8rem;
      font-size: 0.92rem;
      margin-bottom: 0.35rem;
    }
    .layer-when { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
    .layer-hint { color: var(--muted); font-weight: 400; font-size: 0.78rem; margin-left: 0.35rem; }
    .layer-svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .layer-block { fill-opacity: 0.55; stroke-width: 1.5; }
    .layer-block-0 { fill: var(--c-percussions); stroke: var(--c-percussions); }
    .layer-block-1 { fill: var(--c-basses); stroke: var(--c-basses); }
    .layer-block-2 { fill: var(--c-accords); stroke: var(--c-accords); }
    .layer-block-3 { fill: var(--c-voix); stroke: var(--c-voix); }

    @media (max-width: 480px) {
      body { padding: 1.75rem 0.85rem 3rem; }
      .card { padding: 1.15rem; }
      .metrics { grid-template-columns: 1fr; }
      .player { gap: 0.6rem; padding: 0.75rem 0.85rem; }
    }
  </style>
</head>
<body>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // Plays the file the user picked, straight from their disk (an object
    // URL), against the layer timeline. Called by the upload script once the
    // result page is in place; a page reached without that file (a plain
    // form submit, a reload) keeps the player hidden.
    window.attachPlayer = function (root, file) {
      var player = root.querySelector("[data-player]");
      var map = root.querySelector("[data-layer-map]");
      if (!player || !map || !file || !window.URL || !URL.createObjectURL) return;

      var audio = document.createElement("audio");
      if (!audio.canPlayType) return;

      var toggle = player.querySelector("[data-player-toggle]");
      var scrub = player.querySelector("[data-player-scrub]");
      var current = player.querySelector("[data-player-current]");
      var total = player.querySelector("[data-player-total]");
      var playheads = root.querySelectorAll("[data-playhead]");
      var url = URL.createObjectURL(file);

      // The bars are drawn on the server's 0..duration scale, so clicks and
      // the playhead use that same scale; the clock shows the real length.
      var drawn = parseFloat(map.getAttribute("data-duration")) || 0;
      function length() {
        return isFinite(audio.duration) && audio.duration > 0 ? audio.duration : drawn;
      }
      function scale() { return drawn > 0 ? drawn : length(); }

      function mmss(sec) {
        var s = Math.max(0, Math.round(sec || 0));
        var m = Math.floor(s / 60);
        s = s % 60;
        return m + ":" + (s < 10 ? "0" : "") + s;
      }

      var scrubbing = false;
      function render() {
        var t = audio.currentTime || 0;
        var fraction = scale() > 0 ? Math.min(1, t / scale()) : 0;
        for (var i = 0; i < playheads.length; i++) {
          playheads[i].style.left = (fraction * 100).toFixed(3) + "%";
        }
        if (!scrubbing) scrub.value = length() > 0 ? Math.round((t / length()) * 1000) : 0;
        current.textContent = mmss(t);
      }

      var frame = null;
      function loop() {
        render();
        frame = audio.paused ? null : requestAnimationFrame(loop);
      }

      function seek(t, play) {
        audio.currentTime = Math.max(0, Math.min(t, length()));
        render();
        if (play && audio.paused) audio.play();
      }

      audio.addEventListener("loadedmetadata", function () {
        total.textContent = mmss(length());
        player.hidden = false;
        map.classList.add("is-live");
        var hint = root.querySelector("[data-player-hint]");
        if (hint) hint.hidden = false;
        for (var i = 0; i < playheads.length; i++) playheads[i].hidden = false;
        var times = root.querySelectorAll("[data-seek]");
        for (var j = 0; j < times.length; j++) times[j].disabled = false;
        render();
      });
      // A format this browser cannot decode (some .m4a, for one): leave the
      // page as it was rather than show controls that do nothing.
      audio.addEventListener("error", function () {
        URL.revokeObjectURL(url);
      });
      audio.addEventListener("play", function () {
        player.classList.add("is-playing");
        toggle.setAttribute("aria-label", "Pause");
        if (frame === null) frame = requestAnimationFrame(loop);
      });
      audio.addEventListener("pause", function () {
        player.classList.remove("is-playing");
        toggle.setAttribute("aria-label", "Play");
        render();
      });
      audio.addEventListener("seeked", render);

      toggle.addEventListener("click", function () {
        if (audio.paused) audio.play(); else audio.pause();
      });

      scrub.addEventListener("input", function () {
        scrubbing = true;
        seek((scrub.value / 1000) * length(), false);
      });
      scrub.addEventListener("change", function () { scrubbing = false; });

      map.addEventListener("click", function (event) {
        if (!map.classList.contains("is-live")) return;
        var time = event.target.closest("[data-seek]");
        if (time) {
          seek(parseFloat(time.getAttribute("data-seek")), true);
          return;
        }
        var plot = event.target.closest("[data-seek-plot]");
        if (plot) {
          var box = plot.getBoundingClientRect();
          if (box.width > 0) seek(((event.clientX - box.left) / box.width) * scale(), true);
        }
      });

      // Space plays/pauses, arrows step 5 s - unless a control has focus and
      // the key already means something there.
      document.addEventListener("keydown", function (event) {
        if (player.hidden || event.altKey || event.ctrlKey || event.metaKey) return;
        var tag = event.target && event.target.tagName;
        if (tag === "INPUT" || tag === "BUTTON" || tag === "A" || tag === "TEXTAREA") return;
        if (event.key === " ") {
          event.preventDefault();
          toggle.click();
        } else if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
          seek(audio.currentTime + (event.key === "ArrowRight" ? 5 : -5), false);
        }
      });

      window.addEventListener("pagehide", function () {
        audio.pause();
        URL.revokeObjectURL(url);
      });

      audio.preload = "metadata";
      audio.src = url;
    };
  </script>
</body>
</html>
